<div class="PINChangeMainSection">
  
  <div class="header" id="PINHeader">
    <div>
      <img src="img/ReturnArrowIcon.png" alt=""  id="backBtn">
    </div>
    <div class="title-text-container">
      <p class="title-text">Change PIN</p>
    </div>
    <div>

    </div>
  </div>

  <div class="PINEntryContainer">
    <input type="text" id="PINInputTextField">
    <button class="PINEntryBtn" id="PINChange1">1</button>
    <button class="PINEntryBtn" id="PINChange2">2</button>
    <button class="PINEntryBtn" id="PINChange3">3</button>
    <button class="PINEntryBtn" id="PINChange4">4</button>
    <button class="PINEntryBtn" id="PINChange5">5</button>
    <button class="PINEntryBtn" id="PINChange6">6</button>
    <button class="PINEntryBtn" id="PINChange7">7</button>
    <button class="PINEntryBtn" id="PINChange8">8</button>
    <button class="PINEntryBtn" id="PINChange9">9</button>
    <button class="PINEntryBtn" id="PINChange0">0</button>
  </div>

  <div id="changingPINStatusBox">

    <div class="message-container" id="message1-container">
      <div class="spinning-circle" id="promptAnimation1"></div>
      <p class="PINChange-message-text">Curent PIN</p>
    </div>
    
    <div class="message-container" id="message2-container">
      <div class="spinning-circle" id="promptAnimation2"></div>
      <p class="PINChange-message-text">New PIN</p>
    </div>
    
    <div class="message-container" id="message3-container">
      <div class="spinning-circle" id="promptAnimation3"></div>
      <p class="PINChange-message-text">Confirm New PIN</p>
    </div>
    
    <div class="message-container" id="message4-container">
      <p class="PINChange-message-text" style="color: green;">New PIN Set</p>
    </div>

  </div>
</div>
